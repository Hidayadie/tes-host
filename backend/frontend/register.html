<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — Cuan't</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="#" class="brand">
          <span class="brand-icon">₵</span>
          <span>Cuan't</span>
        </a>
        <h1 class="auth-title">Buat Akun Baru</h1>
        <p class="auth-subtitle">Mulai catat dan kendalikan keuangan Anda hari ini</p>
      </div>

      <div id="alert-box" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Nama Lengkap</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="Contoh: Budi Santoso" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="nama@email.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Minimal 6 karakter" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password-confirm">Konfirmasi Kata Sandi</label>
          <input 
            type="password" 
            id="password-confirm" 
            class="form-input" 
            placeholder="Ulangi kata sandi" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Daftar Akun
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfAuthenticated();

    const form = document.getElementById("register-form");
    const alertBox = document.getElementById("alert-box");
    const submitBtn = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("password-confirm").value;

      if (!name || !email || !password) {
        alertBox.textContent = "Semua bidang wajib diisi.";
        alertBox.style.display = "flex";
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = "Kata sandi harus minimal 6 karakter.";
        alertBox.style.display = "flex";
        return;
      }

      if (password !== confirmPassword) {
        alertBox.textContent = "Konfirmasi kata sandi tidak cocok.";
        alertBox.style.display = "flex";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Mendaftarkan...";

      try {
        const response = await authAPI.register(name, email, password);
        setAuth(response.token, response.user);
        showToast("Registrasi berhasil! Menyiapkan dashboard...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = "flex";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Daftar Akun";
      }
    });
  </script>
</body>
</html>
