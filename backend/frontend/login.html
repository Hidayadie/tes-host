<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cuan't</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="#" class="brand">
          <span class="brand-icon">₵</span>
          <span>Cuan't</span>
        </a>
        <h1 class="auth-title">Masuk ke Akun Anda</h1>
        <p class="auth-subtitle">Kelola dan pantau keuangan pribadi dengan mudah</p>
      </div>

      <div id="alert-box" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="nama@email.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Masuk
        </button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfAuthenticated();

    const form = document.getElementById("login-form");
    const alertBox = document.getElementById("alert-box");
    const submitBtn = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alertBox.textContent = "Silakan isi email dan kata sandi.";
        alertBox.style.display = "flex";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Memproses...";

      try {
        const response = await authAPI.login(email, password);
        setAuth(response.token, response.user);
        showToast("Login berhasil! Mengalihkan ke dashboard...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = "flex";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
